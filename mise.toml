[tools]
node = "22"
ruby = "3.4.2"

[env]
_.file = ".env"
_.path = ["./bin"]

[tasks.binstubs]
description = "Generate binstubs for all gems"
run = "bundle binstubs --all"

[tasks.setup]
description = "Setup project dependencies and binstubs"
run = [
  "bundle install",
  "mise run binstubs"
]

[tasks.serve]
description = "Start the middleman development server"
run = "bundle exec middleman server"

[tasks.publish]
description = "Build and publish the blog"
run = "rake"
